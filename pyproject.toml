[project]
name = "outilsreq"
version = "0.1.0"
description = "Outils de chargement des données du REQ"
readme = "README.md"
authors = [
    { name = "Jonathan Gendron", email = "65961361+jogendron@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [ "python-dotenv", "psycopg[binary]" ]

[project.scripts]
outilsreq = "outilsreq:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
